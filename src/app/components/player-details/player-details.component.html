<mat-tab-group>
  <mat-tab label="Player Details">
    <div>
      <div
        class="grid grid-cols-3 place-items-start gap-4 mb-2"
        style="min-height: 60px; padding-top: 10px; padding-left: 5px"
      >
        <div>
          <button
            mat-mini-fab
            color="primary"
            (click)="router.navigateByUrl(backTarget)"
          >
            <img
              src="https://img.icons8.com/?size=100&id=65a5j6IY0Vy2&format=png&color=FFFFFF"
              style="width: 40px"
            />
          </button>
        </div>
        <div class="col-span-2">
          <h2 class="player-name-row">
            <span class="player-name">{{ currentPlayer?.name }}</span>
            <!-- MoM badge - only shown once this player has been named Man of the Match at least once (see PlayerService.applyMvpPointsToPlayers). -->
            <span
              *ngIf="currentPlayer?.momCount && currentPlayer!.momCount > 0"
              class="mom-badge"
              title="Man of the Match {{ currentPlayer?.momCount }} time(s)"
            >
              <span class="mom-badge-icon">🏆</span>
              <span class="mom-badge-count"
                >x{{ currentPlayer?.momCount }}</span
              >
            </span>
          </h2>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 place-items-center">
        <ng-container *ngFor="let stat of overviewStats">
          <div class="stat-card-overview" style="display: inline-block">
            <button mat-fab class="stat-card-btn">
              <div class="stat-label">{{ stat.label }}</div>
              <h1 class="stat-value">
                {{ stat.value }}
              </h1>
            </button>
          </div>
        </ng-container>
        <div
          class="stat-card-overview"
          style="display: inline-block"
          *ngIf="currentPlayer?.bestMvpMatchId"
        >
          <button
            mat-fab
            class="stat-card-btn"
            title="View this match"
            (click)="
              router.navigateByUrl(
                'match-details?id=' +
                  currentPlayer!.bestMvpMatchId +
                  '&playerName=' +
                  currentPlayer!.name +
                  '&from=' +
                  backTarget
              )
            "
          >
            <div class="stat-label">Best MVP Performance</div>
            <h1 class="stat-value">
              {{ currentPlayer?.bestMvpPoints ?? 0 }}
            </h1>
          </button>
        </div>
      </div>
      <div
        class="mvp-sparkline-wrap"
        *ngIf="
          currentPlayer?.mvpPointsHistory &&
          currentPlayer!.mvpPointsHistory.length >= 2
        "
      >
        <div class="mvp-sparkline-title">
          MVP Points Trend (last {{ mvpTrendMatchCount }} matches)
        </div>
        <svg
          viewBox="0 0 300 80"
          preserveAspectRatio="xMidYMid meet"
          class="mvp-sparkline"
        >
          <polyline
            [attr.points]="mvpSparklinePoints"
            fill="none"
            stroke="#673ab7"
            stroke-width="2"
          ></polyline>
          <ng-container *ngFor="let point of mvpSparklineData">
            <circle
              [attr.cx]="point.x"
              [attr.cy]="point.y"
              r="2.5"
              fill="#673ab7"
            ></circle>
            <text
              [attr.x]="point.x"
              [attr.y]="point.y - 6"
              text-anchor="middle"
              class="mvp-sparkline-label"
            >
              {{ point.value }}
            </text>
          </ng-container>
        </svg>
      </div>
    </div>
    <div style="display: flex; place-content: center; flex-wrap: wrap">
      <mat-button-toggle-group
        appearance="standard"
        #selectedStat="matButtonToggleGroup"
        [value]="selectedStatOption"
      >
        <mat-button-toggle value="batting" aria-label="Text align left">
          Batting
        </mat-button-toggle>
        <mat-button-toggle value="bowling" aria-label="Text align center">
          Bowling
        </mat-button-toggle>
        <mat-button-toggle value="fielding" aria-label="Text align right">
          Fielding
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <div *ngIf="selectedStat.value === 'batting'">
      <div class="grid grid-cols-2 gap-4 place-items-center mt-4">
        <ng-container *ngFor="let stat of batsmenStats">
          <div class="stat-card-role col-span-1" style="display: inline-block">
            <button mat-fab class="stat-card-btn">
              <div class="stat-label">{{ stat.label }}</div>
              <h1 class="stat-value">
                {{ stat.value | number : "1.0-0" }}<span
                  class="not-out-marker"
                  *ngIf="
                    stat.label === 'Highest Score' && currentPlayer?.isNotOutHS
                  "
                  >*</span
                >
              </h1>
            </button>
          </div>
        </ng-container>
      </div>
      <div class="grid grid-cols-3 gap-4 place-items-center">
        <ng-container *ngFor="let stat of extendedBattingStats">
          <div class="stat-card-overview" style="display: inline-block">
            <button mat-fab class="stat-card-btn">
              <div class="stat-label">{{ stat.label }}</div>
              <h1 class="stat-value">
                {{ stat.value | number : "1.0-1" }}
              </h1>
            </button>
          </div>
        </ng-container>
      </div>
    </div>
    <div *ngIf="selectedStat.value === 'bowling'">
      <div class="grid grid-cols-2 gap-4 place-items-center mt-4">
        <ng-container *ngFor="let stat of bowlerStats">
          <div class="stat-card-role col-span-1" style="display: inline-block">
            <button mat-fab class="stat-card-btn">
              <div class="stat-label">{{ stat.label }}</div>
              <h1
                *ngIf="stat.label !== 'BBI' && stat.label !== 'Wickets'"
                class="stat-value"
              >
                {{ stat.value | number : "1.1-1" }}
              </h1>
              <h1
                *ngIf="stat.label === 'BBI' || stat.label === 'Wickets'"
                class="stat-value"
              >
                {{ stat.value }}
              </h1>
            </button>
          </div>
        </ng-container>
      </div>
      <div class="grid grid-cols-3 gap-4 place-items-center">
        <ng-container *ngFor="let stat of extendedBowlingStats">
          <div class="stat-card-overview" style="display: inline-block">
            <button mat-fab class="stat-card-btn">
              <div class="stat-label">{{ stat.label }}</div>
              <h1 class="stat-value">
                {{ stat.value | number : "1.0-1" }}
              </h1>
            </button>
          </div>
        </ng-container>
      </div>
    </div>
    <div
      *ngIf="selectedStat.value === 'fielding'"
      class="grid grid-cols-2 gap-4 place-items-center mt-4"
    >
      <ng-container *ngFor="let stat of fielderStats">
        <div class="stat-card-role col-span-1" style="display: inline-block">
          <button mat-fab class="stat-card-btn">
            <div class="stat-label">{{ stat.label }}</div>
            <h1 class="stat-value">
              {{ stat.value }}
            </h1>
          </button>
        </div>
      </ng-container>
    </div>
  </mat-tab>
  <mat-tab label="Matches Played">
    <app-match-list
      [matchIds]="currentPlayer?.matchIds"
      [mvpPointsHistory]="currentPlayer?.mvpPointsHistory"
      [isPlayerList]="true"
      [backTarget]="backTarget"
      playerName="{{ currentPlayer?.name }}"
    ></app-match-list>
  </mat-tab>
</mat-tab-group>
