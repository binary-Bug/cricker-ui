<div
  class="grid grid-cols-3 place-items-start gap-4"
  style="height: 60px; padding-top: 10px; padding-left: 5px"
>
  <div>
    <button mat-mini-fab color="primary" (click)="back()">
      <img
        src="https://img.icons8.com/?size=100&id=65a5j6IY0Vy2&format=png&color=FFFFFF"
        style="width: 40px"
      />
    </button>
  </div>

  <div class="col-span-2">
    <h1 style="text-align: center; margin-top: 5px; margin-bottom: 5px">
      All Matches
    </h1>
  </div>
</div>

<ng-container *ngFor="let match of matchesList">
  <mat-card appearance="outlined" class="match-card">
    <mat-card-content>
      <div class="match-card-row">
        <span class="match-teams">
          {{ match.data["teamData"]["team1"]["name"] }}
          <span class="vs-label">vs</span>
          {{ match.data["teamData"]["team2"]["name"] }}
        </span>
        <span class="match-date">{{ match.data["MatchDate"] }}</span>
      </div>
      <div class="match-result-row">
        <span class="match-result">{{ match.data["MatchResult"] }}</span>
      </div>
    </mat-card-content>
    <mat-card-actions class="match-card-actions">
      <div class="match-badges-group">
        <span
          *ngIf="isPlayerList && isPlayerMomForMatch(match)"
          class="match-mom-badge"
          title="Man of the Match"
        >
          🏆 MoM
        </span>
        <span
          *ngIf="isPlayerList && getPlayerMvpPoints(match) !== undefined"
          class="match-mvp-badge"
          [class.clickable]="getPlayerMvpBreakdown(match)"
          [title]="
            getPlayerMvpBreakdown(match)
              ? 'View MVP breakdown'
              : 'MVP points earned this match'
          "
          (click)="openPlayerMvpBreakdown(match)"
        >
          ⭐ {{ getPlayerMvpPoints(match) }} pts
        </span>
      </div>
      <button mat-mini-fab color="accent" (click)="navigateToMatch(match.id)">
        <img src="assets/icon-external-link.png" style="width: 18px" />
      </button>
    </mat-card-actions>
  </mat-card>
  <br />
</ng-container>
